<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>宝可梦调味料Seed查询</title>
    
    <!-- Bootstrap 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <style>
        .fixed-header {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding-bottom: 10px;
        }
        .seed-col {
            min-width: 160px;
            font-family: monospace;
        }
        .type-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.9em;
        }
        .export-btn {
            position: fixed;
            right: 20px;
            top: 70px;
            z-index: 2;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .seed-checkbox {
            margin-right: 8px;
            vertical-align: middle;
            transform: scale(1.2);
        }
        .alert-custom {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导出按钮 -->
        <button id="exportPS" class="btn btn-primary export-btn">📋 导出选中项</button>

        <!-- 搜索框 -->
        <div class="fixed-header">
            <div class="input-group" style="margin: 20px 0">
                <input type="text" id="searchInput" class="form-control" 
                       placeholder="输入料数（例：7料）或条件（例：甜3 酸2）">
                <span class="input-group-btn">
                    <button class="btn btn-default" type="button" onclick="clearSearch()">
                        清空
                    </button>
                </span>
            </div>
        </div>

        <!-- 数据表格 -->
        <table class="table table-bordered table-hover">
            <thead>
                <tr class="info">
                    <th class="seed-col">Seed</th>
                    <th>宝可梦</th>
                    <th>太晶属性</th>
                    <th>技能组合</th>
                    <th>咸</th>
                    <th>辣</th>
                    <th>苦</th>
                    <th>甜</th>
                    <th>酸</th>
                    <th>总个数</th>
                </tr>
            </thead>
            <tbody id="dataBody">
                <!-- 数据动态插入 -->
            </tbody>
        </table>
    </div>

    <!-- Bootstrap & jQuery -->
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>

    <!-- 数据 -->
    <script>
        // 紫5星数据
        const purple5Data = [
            {seed:"008F2C8A",name:"浩大鲸",taijing:"岩石",skills:"无/水流裂破/哈欠/找伙伴",salty:1,spicy:2,bitter:2,sweet:1,sour:1,total:7},
            {seed:"00AC2C1B",name:"浩大鲸",taijing:"地面",skills:"无/水流裂破/哈欠/找伙伴",salty:3,spicy:1,bitter:2,sweet:0,sour:1,total:7},
            // 其他数据...
        ];

        // 紫6星数据
        const purple6Data = [
            // ...（保持原有数据不变）...
        ];

        // 合并数据
        const allData = [...purple5Data, ...purple6Data];
    </script>

    <!-- 功能实现 -->
    <script>
        let selectedSeeds = new Set();

        // 渲染表格
        function renderData(data) {
            const tbody = $('#dataBody');
            tbody.empty();

            data.forEach(item => {
                const isChecked = selectedSeeds.has(item.seed) ? 'checked' : '';
                const row = `
                    <tr>
                        <td class="seed-col">
                            <input type="checkbox" class="seed-checkbox" 
                                   data-seed="${item.seed}" ${isChecked}>
                            ${item.seed}
                        </td>
                        <td>${item.name}</td>
                        <td><span class="type-badge" style="background:#${getTypeColor(item.taijing)}">${item.taijing}</span></td>
                        <td>${item.skills.replace(/无\/?/g,'')}</td>
                        <td>${item.salty}</td>
                        <td>${item.spicy}</td>
                        <td>${item.bitter}</td>
                        <td>${item.sweet}</td>
                        <td>${item.sour}</td>
                        <td>${item.total}</td>
                    </tr>
                `;
                tbody.append(row);
            });
        }

        // 属性颜色映射
        function getTypeColor(type) {
            const colors = {
                '岩石':'B8A038', '地面':'E0C068', '火':'F08030', '水':'6890F0',
                '草':'78C850', '电':'F8D030', '冰':'98D8D8', '龙':'7038F8',
                '恶':'705848', '妖精':'EE99AC', '格斗':'C03028', '飞行':'A890F0',
                '毒':'A040A0', '幽灵':'705898', '钢':'B8B8D0', '超能力':'F85888',
                '虫':'A8B820', '一般':'A8A878'
            };
            return colors[type] || '666666';
        }

        // 搜索功能
        $('#searchInput').on('input', function() {
            const inputVal = $(this).val().trim();
            const condMap = { '咸':'salty', '辣':'spicy', '苦':'bitter', '甜':'sweet', '酸':'sour' };
            let targetNum = null;
            const conditions = {};

            // 解析总料数
            const totalMatch = inputVal.match(/(\d+)\s*料/);
            if (totalMatch) targetNum = parseInt(totalMatch, 10);

            // 解析具体条件
            inputVal.split(/\s+/).forEach(term => {
                const match = term.match(/([咸辣苦甜酸])(\d*)/);
                if (match) {
                    const prop = condMap[match];
                    const value = match ? parseInt(match, 10) : 1;
                    conditions[prop] = value;
                }
            });

            // 过滤数据
            const filtered = allData.filter(item => {
                if (targetNum && item.total !== targetNum) return false;
                for (const [prop, val] of Object.entries(conditions)) {
                    if (item[prop] < val) return false;
                }
                return true;
            });

            renderData(filtered);
        });

        // 复选框事件
        $(document).on('change', '.seed-checkbox', function() {
            const seed = $(this).data('seed');
            $(this).is(':checked') ? selectedSeeds.add(seed) : selectedSeeds.delete(seed);
        });

        // 导出功能
        $('#exportPS').click(function() {
            const seeds = Array.from(selectedSeeds);
            if (seeds.length === 0) {
                showNotice('⚠️ 请先选择至少一个Seed', 'warning');
                return;
            }
            
            const temp = $('<textarea>');
            $('body').append(temp);
            temp.val(seeds.join('\n')).select();
            
            try {
                document.execCommand('copy');
                showNotice(`✅ 已复制 ${seeds.length} 个Seed`, 'success');
            } catch (err) {
                showNotice('❌ 复制失败，请手动选择', 'danger');
            }
            temp.remove();
        });

        // 显示通知
        function showNotice(msg, type) {
            $('.alert-custom').remove();
            const colors = {
                success: '#dff0d8',
                warning: '#fcf8e3',
                danger: '#f2dede',
                info: '#d9edf7'
            };
            
            const notice = $(`
                <div class="alert-custom" style="background:${colors[type]};color:#333">
                    ${msg}
                </div>
            `).hide().fadeIn(300);
            
            $('body').append(notice);
            setTimeout(() => notice.fadeOut(500), 1500);
        }

        // 清空搜索
        function clearSearch() {
            $('#searchInput').val('');
            renderData(allData);
        }

        // 初始化加载
        $(() => renderData(allData));
    </script>
</body>
</html>
